name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # 使用自定义域名（tdwc.luomor.com）时站点挂在根路径
          # 若改用 <用户名>.github.io/<仓库名> 访问，改为 /${{ github.event.repository.name }}/
          VITE_BASE: /

      - uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时自动创建并启用（build_type 为 workflow）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
